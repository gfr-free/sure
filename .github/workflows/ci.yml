name: CI

on:
  workflow_call:
    inputs:
      require_js_dependency_audit:
        description: "Fail the workflow when the importmap JavaScript dependency audit cannot complete"
        required: false
        type: boolean
        default: false

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in Ruby dependencies
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        continue-on-error: ${{ !inputs.require_js_dependency_audit }}
        env:
          REQUIRE_JS_DEPENDENCY_AUDIT: ${{ inputs.require_js_dependency_audit }}
        run: |
          attempts=3
          if [ "$REQUIRE_JS_DEPENDENCY_AUDIT" != "true" ]; then
            attempts=1
          fi

          for attempt in $(seq 1 "$attempts"); do
            echo "Running importmap audit, attempt ${attempt}/${attempts}"
            bin/importmap audit && exit 0

            if [ "$attempt" = "$attempts" ]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  lint_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install
        shell: bash

      - name: Lint/Format js code
        run: npm run lint

  test_unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PLAID_CLIENT_ID: foo
      PLAID_SECRET: bar
      DATABASE_URL: postgres://postgres:postgres@localhost:5432 # pipelock:ignore
      REDIS_URL: redis://localhost:6379
      RAILS_ENV: test

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      # Apt mirrors on the runners are sometimes slow (minutes for libvips and
      # its dependencies), so keep the downloaded packages per runner image.
      - name: Runner image version
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.image.outputs.version }}-libvips

      - name: Install packages
        run: |
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvips libpq-dev
          cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          echo "Cached $(ls ~/apt-archives | wc -l) packages"

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: DB setup and smoke test
        run: |
          bin/rails db:create
          bin/rails db:schema:load
          bin/rails db:seed

      - name: Unit and integration tests
        run: bin/rails test

      # Encryption tests skip unless Active Record encryption is configured
      # through ENV or credentials (Encryptable.encryption_ready?), so the run
      # above never exercises them. Rerun every test file that checks
      # encryption_ready? with throwaway keys, so new encryption tests are
      # picked up without a hand-kept list. The whole suite is not run with
      # keys because unrelated tests assume encryption is off.
      - name: Encryption tests
        if: ${{ !cancelled() }}
        env:
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test
        run: |
          mapfile -t files < <(grep -rl --include='*_test.rb' 'encryption_ready?' test | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No encryption tests found" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          bin/rails test "${files[@]}"

  # System tests run serially (they flake when parallel workers compete for
  # the runner's CPUs), so they are split by file across several runners.
  test_system_shard:
    name: test_system (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]

    env:
      PLAID_CLIENT_ID: foo
      PLAID_SECRET: bar
      DATABASE_URL: postgres://postgres:postgres@localhost:5432 # pipelock:ignore
      REDIS_URL: redis://localhost:6379
      RAILS_ENV: test

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      # Apt mirrors on the runners are sometimes slow (minutes for libvips and
      # its dependencies), so keep the downloaded packages per runner image.
      - name: Runner image version
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.image.outputs.version }}-libvips

      - name: Install packages
        run: |
          mkdir -p ~/apt-archives
          sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvips libpq-dev
          cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          echo "Cached $(ls ~/apt-archives | wc -l) packages"
          # Drop the image's chromedriver so Selenium Manager resolves a driver
          # matching the image's Chrome, even if the two drift apart.
          sudo rm -f /usr/bin/chromedriver

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: DB setup and smoke test
        run: |
          bin/rails db:create
          bin/rails db:schema:load
          bin/rails db:seed

      - name: System tests
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
        run: |
          mapfile -t files < <(find test/system -name '*_test.rb' | sort | awk -v n="$SHARDS" -v i="$SHARD" 'NR % n == i % n')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No system tests in shard ${SHARD}/${SHARDS}" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          # Unlike test:system, running test files directly skips test:prepare,
          # which builds the Tailwind CSS the pages need.
          bin/rails test:prepare
          DISABLE_PARALLELIZATION=true bin/rails test "${files[@]}"

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: screenshots-${{ matrix.shard }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Keeps a single "test_system" check for branch protection and reviewers.
  test_system:
    if: ${{ !cancelled() }}
    needs: test_system_shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check system test shards
        env:
          RESULT: ${{ needs.test_system_shard.result }}
        run: |
          echo "System test shards: ${RESULT}"
          [ "$RESULT" = "success" ]
