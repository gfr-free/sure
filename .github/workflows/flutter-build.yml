name: Flutter Mobile Build

on:
  workflow_call:
    inputs:
      build_name:
        description: "App version name; defaults to the version in .sure-version"
        required: false
        type: string
        default: ""
    outputs:
      has_app_release_aab:
        description: "Whether a signed release AAB artifact was produced"
        value: ${{ jobs.build-android.outputs.has_app_release_aab }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-version:
    name: Resolve app version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          sparse-checkout: .sure-version
          sparse-checkout-cone-mode: false

      - name: Resolve version name and build number
        id: version
        env:
          INPUT_BUILD_NAME: ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          BUILD_NAME="${INPUT_BUILD_NAME:-$(tr -d '[:space:]' < .sure-version)}"
          BUILD_NAME="${BUILD_NAME#v}"
          if [[ ! "$BUILD_NAME" =~ ^[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "::error::Invalid app version name: '$BUILD_NAME'"
            exit 1
          fi
          # Minutes since the epoch: increases across every workflow that builds
          # the app, stays above the last pubspec code (20260402) and below
          # Android's versionCode limit of 2100000000.
          BUILD_NUMBER="$(( $(date -u +%s) / 60 ))"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "App version: $BUILD_NAME ($BUILD_NUMBER)"

  build-android:
    name: Build Android APK
    needs: app-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_app_release_aab: ${{ steps.check_secrets.outputs.has_keystore }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Copy Sure icons from public/
        run: cp public/android-chrome-512x512.png mobile/assets/icon/app_icon.png

      - name: Generate app icons
        working-directory: mobile
        run: flutter pub run flutter_launcher_icons

      - name: Analyze code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Check if keystore secrets exist
        id: check_secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "✓ Keystore secrets found, will build signed APK"
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "⚠ No keystore secrets, will build unsigned debug APK"
          fi

      - name: Decode and setup keystore
        if: steps.check_secrets.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/upload-keystore.jks
          echo "storePassword=$KEY_STORE_PASSWORD" > mobile/android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> mobile/android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> mobile/android/key.properties
          echo "storeFile=upload-keystore.jks" >> mobile/android/key.properties
          echo "✓ Keystore configured successfully"

      - name: Build APK (Release)
        working-directory: mobile
        env:
          BUILD_NAME: ${{ needs.app-version.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.app-version.outputs.build_number }}
        run: |
          if [ "${{ steps.check_secrets.outputs.has_keystore }}" == "true" ]; then
            echo "Building signed release APK..."
            flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          else
            echo "Building debug-signed APK..."
            flutter build apk --debug --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app-release-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Build App Bundle (Release)
        if: steps.check_secrets.outputs.has_keystore == 'true'
        working-directory: mobile
        env:
          BUILD_NAME: ${{ needs.app-version.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.app-version.outputs.build_number }}
        run: flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Upload AAB artifact
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    needs: app-version
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Copy Sure icons from public/
        run: cp public/android-chrome-512x512.png mobile/assets/icon/app_icon.png

      - name: Generate app icons
        working-directory: mobile
        run: flutter pub run flutter_launcher_icons

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install

      - name: Analyze code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Build iOS (No Code Signing)
        working-directory: mobile
        env:
          BUILD_NAME: ${{ needs.app-version.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.app-version.outputs.build_number }}
        run: flutter build ios --release --no-codesign --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Create IPA archive info
        working-directory: mobile
        run: |
          echo "iOS build completed successfully" > build/ios-build-info.txt
          echo "Build date: $(date)" >> build/ios-build-info.txt
          echo "Note: This build is not code-signed and cannot be installed on physical devices" >> build/ios-build-info.txt
          echo "For distribution, you need to configure code signing with Apple certificates" >> build/ios-build-info.txt

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-build-unsigned
          path: |
            mobile/build/ios/iphoneos/Runner.app
            mobile/build/ios-build-info.txt
          retention-days: 30
