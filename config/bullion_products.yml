# Catalogue of common, currently minted bullion coins and bars.
#
# Every size of a coin becomes one offline Security (see BullionCatalog).
# Weights are the FINE metal content, not the gross weight of the piece:
#   fine_oz:    troy ounces of pure metal (1 oz = 31.1034768 g)
#   fine_grams: grams of pure metal
#   face_value: the nominal value of a coin that is legal tender, in the
#               product's face_value_currency; a coin is never valued below it.
#               Coins without one (Krugerrand, Libertad) leave it out.
# Size keys are stable identifiers stored in bullion_specs.size_key; never
# rename one that has shipped.
#
# Bars list no sizes: their weight is entered on the trade, because bars come
# in too many sizes to keep a list of, and at 999.9 fine their gross weight is
# their fine weight. One Security per bar product and weight.
#
# `name` is the English name, stored on the Security. Translations live in
# config/locales/models/bullion_catalog/.
#
# metal: XAU gold, XAG silver, XPT platinum, XPD palladium
# form:  coin or bar

products:
  # --- Gold coins ---
  - key: krugerrand
    name: Krugerrand
    metal: XAU
    form: coin
    sizes:
      - { key: 1oz, label: "1 oz", fine_oz: 1 }
      - { key: 1-2oz, label: "1/2 oz", fine_oz: 0.5 }
      - { key: 1-4oz, label: "1/4 oz", fine_oz: 0.25 }
      - { key: 1-10oz, label: "1/10 oz", fine_oz: 0.1 }

